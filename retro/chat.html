<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="description" content="Ask about Girwan Dhakal’s projects and work experience.">
  <title>Chat | Girwan Dhakal</title>
  <link rel="icon" href="assets/animal-domestic-lion-svgrepo-com.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/Manrope.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="site.css">
  <script src="navigation.js" defer></script>
  <script src="chat.js" defer></script>
</head>
<body class="chat-page">
  <a class="skip" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <button class="menu-toggle" type="button" aria-controls="site-navigation" aria-expanded="false" hidden>Menu</button>
      <nav id="site-navigation" class="site-nav" aria-label="Main navigation">
        <a class="home-link" href="index.html" aria-label="Home">Home</a>
        <a href="experience.html">Experience</a>
        <a href="projects.html">Projects</a>
        <a href="education.html">Education &amp; skills</a>
        <a href="contact.html">Contact</a>
        <a href="chat.html" aria-current="page">Chat</a>
        <a href="https://drive.google.com/file/d/19ZlE3TBH60342uetNyYsDHVeINJYsBdf/view?usp=sharing">Résumé</a>
      </nav>
    </header>
    <main id="main" tabindex="-1">
      <h1>Chat</h1>
      <p>Ask my AI assistant about my projects, work, or research.</p>
      <div id="conversation" class="conversation" role="log" aria-label="Conversation" tabindex="0"></div>
      <nav class="page-links" aria-label="Adjacent pages"><a href="contact.html" rel="prev">← Contact</a></nav>
      <form id="chat-form" class="retro-form" hidden>
        <div class="form-group">
          <label for="question">Your question</label>
          <textarea id="question" rows="2" maxlength="400" required aria-describedby="chat-privacy"></textarea>
        </div>
        <button type="submit" class="retro-btn">Send</button>
        <p id="chat-privacy" class="small">Please leave out private information.</p>
        <p id="chat-status" class="form-status" role="status"></p>
      </form>
      <noscript><p>Enable JavaScript to use the chat, or <a href="contact.html">contact me directly</a>.</p></noscript>
    </main>
  </div>
</body>
</html>
